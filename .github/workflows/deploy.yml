name: Sales CRM CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pipi2303/salesappv20

jobs:
  build-and-deploy:
    name: Build & Deploy Sales CRM
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================
      # 1.5. Type Check (Bab 16.5 Tier 2, 23 Sep 2026)
      #
      # Visibility, NOT a blocking gate yet: this repo has 154
      # pre-existing TypeScript errors (never checked before -- there
      # was no tsconfig.json at all until now) that are out of scope to
      # fix here. `continue-on-error: true` means this step's result
      # shows up clearly in the Actions run (red X on the step, green
      # check on the job) without blocking the actual deploy below.
      # Once the backlog is triaged/fixed, drop continue-on-error to
      # make this a real gate.
      # ==========================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check (non-blocking for now)
        continue-on-error: true
        run: npx tsc --noEmit


      # ==========================================
      # 2. Docker Buildx
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================
      # 3. Login to GHCR
      # ==========================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # 4. Docker Metadata
      # ==========================================
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha


      # ==========================================
      # 5. Build & Push Docker Image
      # ==========================================
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ==========================================
      # 6. Deploy to Portainer
      # ==========================================
      - name: Deploy to Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}

        run: |

          echo "=========================================="
          echo "Deploying Sales CRM to Portainer"
          echo "=========================================="

          echo "Stack ID: ${PORTAINER_STACK_ID}"
          echo "Endpoint ID: ${PORTAINER_ENDPOINT_ID}"

          # Convert docker-compose.yml into JSON string
          COMPOSE_JSON=$(jq -Rs . < docker-compose.yml)

          # Update Portainer stack
          curl --fail-with-body \
            --silent \
            --show-error \
            --insecure \
            -X PUT \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{
              \"StackFileContent\": ${COMPOSE_JSON},
              \"Env\": [],
              \"Prune\": false,
              \"RepullImageAndRedeploy\": true
            }" \
            "${PORTAINER_URL}/api/stacks/${PORTAINER_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}"

          echo ""
          echo "=========================================="
          echo "Portainer deployment completed"
          echo "=========================================="


      # ==========================================
      # 7. Deployment Summary
      # ==========================================
      - name: Deployment Summary
        run: |

          echo "=========================================="
          echo "Sales CRM deployment completed"
          echo "=========================================="

          echo "Image:"
          echo "ghcr.io/pipi2303/salesappv20:latest"

          echo ""

          echo "Platform:"
          echo "linux/amd64"

          echo ""

          echo "Portainer:"
          echo "Stack ID: ${{ secrets.PORTAINER_STACK_ID }}"
          echo "Endpoint ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}"

          echo ""

          echo "Commit:"
          echo "${GITHUB_SHA}"

          echo "=========================================="